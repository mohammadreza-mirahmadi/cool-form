<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link rel="stylesheet" href="./styles/signIn.css" />
  </head>
  <body>
    <section class="form-container">
      <form action="#" class="form">
        <h1 class="form__title">Sign In</h1>
        <fieldset class="form__input-container">
          <label for="username" class="form__label">Username:</label>
          <input
            type="text"
            id="username"
            class="input"
            name="username"
            placeholder="Enter your username"
            required
          />
        </fieldset>
        <fieldset class="form__input-container">
          <label for="pass" class="form__label">Password:</label>
          <input
            type="password"
            id="pass"
            class="input"
            name="pass"
            placeholder="Enter your password"
            required
          />
        </fieldset>
        <input
          type="checkbox"
          class="checkbox"
          id="privacy-policy"
          name="remember-me"
          value="yes"
          readonly
        />
        <label for="remember-me" class="form__label">Remember Me</label>
        <button type="submit" class="form__btn">Sign In</button>
        <p class="form__text">
          Don't have an account?
          <a href="./signUp.html" class="form__link">Sign Up</a>
        </p>
        <p class="form__text forgot-pass">
          <a href="#" class="form__link">Forgot Password!</a>
        </p>
      </form>
    </section>
  </body>
</html>
